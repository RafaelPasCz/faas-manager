spring.application.name=faas-manager
server.port=${SERVER_PORT:8080}

# Conexão Stateless via TCP/IP com a instância isolada do PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:faas_manager}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:faas_admin}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:1234}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false

# CORS parametrizado por variável de ambiente
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200}

# Alias de rede para alcançar o loopback do host quando em container
app.network.host-loopback-alias=${HOST_LOOPBACK_ALIAS:}

